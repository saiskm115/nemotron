asr:
  # Registry id of the model to use when a session does not choose one.
  # See backend/providers/asr/registry.py for the full catalogue.
  primary: svanita_0_6b
  supported:
    - svanita_0_6b
    - svanita_0_6b_telugu
    - indic_conformer_600m
    - whisper_small_int8
    - vasista22_whisper_telugu
    - whisper_large_v3
    - sarvam_saaras_v4

diarization:
  # "local_acoustic" runs VAD + ECAPA-TDNN speaker embeddings + agglomerative
  # clustering on CPU. Set NEMOTRON_ENDPOINT to route to a remote Nemotron/Sortformer
  # service instead; installing nemo_toolkit enables local Sortformer.
  #
  # Whichever backend runs, the result is re-clustered against measured speaker
  # embeddings to the number of voices actually present. Backends treat a speaker
  # limit as a capacity rather than a prediction -- Sortformer is a power-set model
  # and will label a two-voice call with all four of its classes -- so max_speakers
  # is a ceiling on the published count, not a hint to the model.
  primary: local_acoustic
  supported:
    - local_acoustic
    - sortformer
    - nemotron_endpoint
  max_speakers: 8
  min_speakers: 1
  auto_speaker_count: true

translation:
  primary: sarvam
  supported:
    - sarvam
    - llm
    - nllb

audio:
  sample_rate: 16000
  channels: 1
  format: wav

alignment:
  overlap_threshold_sec: 0.15
  ambiguity_delta_sec: 0.05
  merge_turn_gap_sec: 0.45
